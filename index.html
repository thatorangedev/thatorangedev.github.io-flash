<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <title>Flash</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <div class="brand">flash<span>.</span></div>
  <button id="logoutBtn" class="small-btn hidden">Çıkış</button>
</header>

<main>
  <section id="authSection" class="auth-box">
    <h1>Flash'a hoş geldin.</h1>
    <p>Paylaş, keşfet ve insanlarla bağlantı kur.</p>

    <div class="tabs">
      <button id="loginTab" class="active">Giriş yap</button>
      <button id="signupTab">Kayıt ol</button>
    </div>

    <form id="authForm">
      <input id="email" type="email" placeholder="E-posta" required>
      <input id="password" type="password" placeholder="Şifre" required minlength="6">
      <input id="username" type="text" placeholder="Kullanıcı adı" maxlength="24" class="hidden">
      <button id="authSubmit" type="submit">Giriş yap</button>
    </form>

    <p id="authMessage" class="message"></p>
  </section>

  <section id="appSection" class="hidden">
    <div class="welcome">
      <div>
        <h2>Akış</h2>
        <p>Bugün neler oluyor?</p>
      </div>
    </div>

    <form id="postForm" class="composer">
      <textarea id="postContent" maxlength="280"
        placeholder="Aklından neler geçiyor?"></textarea>

      <div class="composer-bottom">
        <label class="file-label">
          <input id="postImage" type="file" accept="image/*">
          <span>＋ Fotoğraf</span>
        </label>
        <span id="charCount">0/280</span>
        <button type="submit">Paylaş</button>
      </div>
    </form>

    <div id="feed">
      <p class="empty">Gönderiler yükleniyor...</p>
    </div>
  </section>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js"></script>
</body>
  </html>
